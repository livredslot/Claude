<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#11151c" />
    <title>Mystical Armies</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M8 1l2 5h5l-4 3 2 6-5-4-5 4 2-6-4-3h5z%22 fill=%22%23c084fc%22/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #11151c; overflow: hidden; touch-action: none; }
      #game { width: 100%; height: 100%; }
      #rotate { display: none; }
      /* On phones held upright, ask the player to rotate: the game is landscape only. */
      @media (orientation: portrait) and (max-width: 900px) {
        #rotate {
          display: flex; position: fixed; inset: 0; z-index: 10; align-items: center; justify-content: center;
          background: #11151c; color: #e5e7eb; font: 600 22px system-ui, sans-serif; text-align: center; padding: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div id="rotate">Please rotate your device to landscape ↻</div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
